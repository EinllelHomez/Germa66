<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Germa 66</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23FBF8F2' stroke='%23111111' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23C8102E' stroke='%23111111' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- Onomatopeyas en katakana: solo se descargan los caracteres que se usan -->
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap&text=%E3%83%89%E3%83%B3!%E3%82%AC%E3%82%B7%E3%83%A3%E3%83%93%E3%83%AA%E3%82%B6%E3%83%83%E3%82%B8%E3%83%BC%E3%82%B3%E3%82%AE%E3%83%AD" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login -->
<main id="login-view" class="login">
  <section class="login-brand" aria-hidden="true">
    <div class="velocidad"></div>
    <div class="tono"></div>
    <div class="olas"></div>
    <span class="onomato onomato-login">ドン!</span>
    <!-- ARTE OFICIAL TEMPORAL (uso académico): germa66-flag.png. Sustituir por arte original. -->
    <div class="emblema"><img class="em" src="assets/germa66-flag.png" alt=""></div>
    <div class="brand-wordmark">
      <p class="brand-reino">Reino de</p>
      <p class="brand-name">Germa</p>
      <p class="brand-number">66</p>
      <p class="brand-caption">Sistema de gestión &middot; Familia Vinsmoke</p>
    </div>
    <div class="hermanos">
      <i style="--c:var(--rojo);--h:100%"></i>
      <i style="--c:var(--azul-mar);--h:82%"></i>
      <i style="--c:var(--dorado);--h:92%"></i>
      <i style="--c:var(--verde);--h:74%"></i>
      <i style="--c:var(--rosa);--h:64%"></i>
    </div>
  </section>
  <section class="login-panel">
    <form id="login-form" class="vineta" novalidate>
      <span class="pestana">Registro de acceso</span>
      <h1>Iniciar sesión</h1>
      <p class="muted">Accede con tu cuenta de Germa 66.</p>
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="globo grito" role="alert" hidden></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </section>
</main>

<!-- App -->
<div id="app-view" class="app" hidden>
  <header class="topbar">
    <button id="menu-btn" class="btn menu-btn" aria-label="Abrir menú" aria-expanded="false">Menú</button>
    <div class="topbar-title">
      <div class="emblema" aria-hidden="true"><img class="em" src="assets/germa66-flag.png" alt=""></div>
      <span>Germa</span>
    </div>
    <div class="topbar-user">
      <span id="user-name"></span>
      <span id="user-role" class="sello"></span>
      <button id="logout-btn" class="btn">Cerrar sesión</button>
    </div>
  </header>
  <nav id="nav" class="nav" aria-label="Capítulos"></nav>
  <main id="content" class="content" tabindex="-1"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="app.js"></script>
</body>
</html>
