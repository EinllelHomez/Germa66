<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Germa 66</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' transform='rotate(45 16 16)' fill='%230b0d10'/%3E%3Cpath d='M19 4 L11 18 L15 18 L13 28 L22 14 L17 14 Z' fill='%23cac545'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login -->
<main id="login-view" class="login">
  <section class="login-brand" aria-hidden="true">
    <div class="brand-glow"></div>
    <img class="brand-flag" src="assets/germa66-flag.png" alt="">
    <div class="brand-wordmark">
      <p class="brand-name">Germa</p>
      <p class="brand-number">66</p>
      <p class="brand-caption">Sistema de gestión &middot; Familia Vinsmoke</p>
    </div>
    <div class="suit-stripes"><i></i><i></i><i></i><i></i><i></i></div>
  </section>
  <section class="login-panel">
    <form id="login-form" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="muted">Accede con tu cuenta de Germa 66.</p>
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </section>
</main>

<!-- App -->
<div id="app-view" class="app" hidden>
  <header class="topbar">
    <button id="menu-btn" class="btn ghost menu-btn" aria-label="Abrir menú" aria-expanded="false">Menú</button>
    <div class="topbar-title"><img class="mark" src="assets/germa66-flag.png" alt="Germa 66"> Germa</div>
    <div class="topbar-user">
      <span id="user-name"></span>
      <span id="user-role" class="chip"></span>
      <button id="logout-btn" class="btn ghost">Cerrar sesión</button>
    </div>
  </header>
  <nav id="nav" class="nav" aria-label="Módulos"></nav>
  <main id="content" class="content" tabindex="-1"></main>
</div>

<script src="app.js"></script>
</body>
</html>
