<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Germa 66</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23FBF8F2' stroke='%23111111' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23C8102E' stroke='%23111111' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Pirata+One&family=Rye&display=swap" rel="stylesheet">
  <!-- Onomatopeyas en katakana: solo se descargan los caracteres que se usan -->
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap&text=%E3%83%89%E3%83%B3!%E3%82%AC%E3%82%B7%E3%83%A3%E3%83%93%E3%83%AA%E3%82%B6%E3%83%83%E3%82%B8%E3%83%BC%E3%82%B3%E3%82%AE%E3%83%AD" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Arte original: emblema-timón del reino y rosa de los vientos (se reutilizan con <use>) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="emblema" viewBox="0 0 100 100">
    <g id="radio-timon">
      <line x1="50" y1="50" x2="50" y2="6" style="stroke:var(--tinta)" stroke-width="5" stroke-linecap="round"/>
      <rect x="45.5" y="1" width="9" height="14" rx="4" style="fill:var(--tinta)"/>
    </g>
    <use href="#radio-timon" transform="rotate(45 50 50)"/>
    <use href="#radio-timon" transform="rotate(90 50 50)"/>
    <use href="#radio-timon" transform="rotate(135 50 50)"/>
    <use href="#radio-timon" transform="rotate(180 50 50)"/>
    <use href="#radio-timon" transform="rotate(225 50 50)"/>
    <use href="#radio-timon" transform="rotate(270 50 50)"/>
    <use href="#radio-timon" transform="rotate(315 50 50)"/>
    <circle cx="50" cy="50" r="34" style="fill:none;stroke:var(--tinta)" stroke-width="8"/>
    <circle cx="50" cy="50" r="34" style="fill:none;stroke:var(--papel-claro)" stroke-width="1.2" stroke-dasharray="7 4"/>
    <circle cx="50" cy="50" r="21" style="fill:var(--rojo);stroke:var(--tinta)" stroke-width="4"/>
    <text x="50" y="57.5" text-anchor="middle" font-family="Rye, Georgia, serif" font-size="19"
          style="fill:var(--papel-claro)">66</text>
  </symbol>
  <symbol id="rosa-vientos" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" style="fill:none;stroke:var(--tinta)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="41" style="fill:none;stroke:var(--tinta)" stroke-width="1.2" stroke-dasharray="1.5 3"/>
    <g transform="rotate(45 50 50)">
      <path d="M50 18 L54 46 L82 50 L54 54 L50 82 L46 54 L18 50 L46 46Z" style="fill:var(--papel-claro);stroke:var(--tinta)" stroke-width="1.8"/>
    </g>
    <path d="M50 4 L56 44 L96 50 L56 56 L50 96 L44 56 L4 50 L44 44Z" style="fill:var(--papel-claro);stroke:var(--tinta)" stroke-width="2"/>
    <path d="M50 4 L56 44 L50 50Z M96 50 L56 56 L50 50Z M50 96 L44 56 L50 50Z M4 50 L44 44 L50 50Z" style="fill:var(--tinta)"/>
    <circle cx="50" cy="50" r="4" style="fill:var(--rojo);stroke:var(--tinta)" stroke-width="1.5"/>
  </symbol>
</svg>

<!-- Login -->
<main id="login-view" class="login">
  <section class="login-brand marco" aria-hidden="true">
    <div class="velocidad"></div>
    <div class="olas"></div>
    <span class="onomato onomato-login">ドン!</span>
    <div class="emblema">
      <svg class="em" viewBox="0 0 100 100"><use href="#emblema"/></svg>
      <svg class="trazo" viewBox="-10 -10 120 120"></svg>
    </div>
    <div class="brand-wordmark">
      <p class="brand-reino">Reino de</p>
      <p class="brand-name">Germa</p>
      <p class="brand-number">66</p>
      <p class="brand-caption">Sistema de gestión &middot; Familia Vinsmoke</p>
    </div>
    <div class="hermanos">
      <i style="--c:var(--rojo);--h:100%"></i>
      <i style="--c:var(--azul-mar);--h:82%"></i>
      <i style="--c:var(--dorado);--h:92%"></i>
      <i style="--c:var(--verde);--h:74%"></i>
      <i style="--c:var(--rosa);--h:64%"></i>
    </div>
  </section>
  <section class="login-panel">
    <form id="login-form" class="vineta" novalidate>
      <span class="pestana">Registro de acceso</span>
      <h1>Iniciar sesión</h1>
      <p class="muted">Accede con tu cuenta de Germa 66.</p>
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="globo grito" role="alert" hidden></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </section>
</main>

<!-- App -->
<div id="app-view" class="app" hidden>
  <header class="topbar">
    <button id="menu-btn" class="btn menu-btn" aria-label="Abrir menú" aria-expanded="false">Menú</button>
    <div class="topbar-title">
      <div class="emblema" aria-hidden="true"><svg class="em" viewBox="0 0 100 100"><use href="#emblema"/></svg></div>
      <span>Germa</span>
    </div>
    <div class="topbar-user">
      <span id="user-name"></span>
      <span id="user-role" class="sello"></span>
      <button id="logout-btn" class="btn">Cerrar sesión</button>
    </div>
  </header>
  <nav id="nav" class="nav" aria-label="Capítulos"></nav>
  <main id="content" class="content" tabindex="-1"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="app.js"></script>
</body>
</html>
